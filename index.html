<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" type="text/javascript"></script>
    <title>Happy Birthday Anh Bi</title>
</head>

<body class="not-loaded">
    <div class="night"></div>
    <div class="happy-birthday">𝓗𝓪𝓹𝓹𝔂 𝓑𝓲𝓻𝓽𝓱𝓭𝓪𝔂 𝓐𝓷𝓱 𝓑𝓲</div>
    <div class="birthday-date">6/11/1990 – 6/11/2026</div>

    <div class="scene">
      <div class="wish-text">“Chúc Anh luôn<br>vui vẻ và<br>mạnh khỏe”</div>

      <!-- Bánh sinh nhật -->
      <div class="cake">

        <!-- Nến + sparkle -->
        <div class="candles">

          <div class="candle candle--1">
            <div class="candle__flame-wrap">
              <div class="candle__flame"></div>
              <div class="candle__flame-glow"></div>
            </div>
            <div class="candle__body"></div>
            <div class="candle__lights">
              <div class="flower__light flower__light--1"></div>
              <div class="flower__light flower__light--2"></div>
              <div class="flower__light flower__light--3"></div>
              <div class="flower__light flower__light--4"></div>
            </div>
          </div>

          <div class="candle candle--2">
            <div class="candle__flame-wrap">
              <div class="candle__flame"></div>
              <div class="candle__flame-glow"></div>
            </div>
            <div class="candle__body"></div>
            <div class="candle__lights">
              <div class="flower__light flower__light--1"></div>
              <div class="flower__light flower__light--2"></div>
              <div class="flower__light flower__light--3"></div>
              <div class="flower__light flower__light--4"></div>
            </div>
          </div>

          <div class="candle candle--3">
            <div class="candle__flame-wrap">
              <div class="candle__flame"></div>
              <div class="candle__flame-glow"></div>
            </div>
            <div class="candle__body"></div>
            <div class="candle__lights">
              <div class="flower__light flower__light--1"></div>
              <div class="flower__light flower__light--2"></div>
              <div class="flower__light flower__light--3"></div>
              <div class="flower__light flower__light--4"></div>
            </div>
          </div>

          <div class="candle candle--4">
            <div class="candle__flame-wrap">
              <div class="candle__flame"></div>
              <div class="candle__flame-glow"></div>
            </div>
            <div class="candle__body"></div>
            <div class="candle__lights">
              <div class="flower__light flower__light--1"></div>
              <div class="flower__light flower__light--2"></div>
              <div class="flower__light flower__light--3"></div>
              <div class="flower__light flower__light--4"></div>
            </div>
          </div>

          <div class="candle candle--5">
            <div class="candle__flame-wrap">
              <div class="candle__flame"></div>
              <div class="candle__flame-glow"></div>
            </div>
            <div class="candle__body"></div>
            <div class="candle__lights">
              <div class="flower__light flower__light--1"></div>
              <div class="flower__light flower__light--2"></div>
              <div class="flower__light flower__light--3"></div>
              <div class="flower__light flower__light--4"></div>
            </div>
          </div>

        </div><!-- /candles -->

        <!-- Tầng bánh trên -->
        <div class="cake__tier cake__tier--top">
          <div class="cake__frosting cake__frosting--top"></div>
          <div class="cake__body cake__body--top">
            <div class="cake__dot cake__dot--1"></div>
            <div class="cake__dot cake__dot--2"></div>
            <div class="cake__dot cake__dot--3"></div>
            <div class="cake__stripe cake__stripe--1"></div>
            <div class="cake__stripe cake__stripe--2"></div>
          </div>
        </div>

        <!-- Tầng bánh dưới -->
        <div class="cake__tier cake__tier--bottom">
          <div class="cake__frosting cake__frosting--bottom"></div>
          <div class="cake__body cake__body--bottom">
            <div class="cake__dot cake__dot--1"></div>
            <div class="cake__dot cake__dot--2"></div>
            <div class="cake__dot cake__dot--3"></div>
            <div class="cake__dot cake__dot--4"></div>
            <div class="cake__dot cake__dot--5"></div>
            <div class="cake__stripe cake__stripe--1"></div>
            <div class="cake__stripe cake__stripe--2"></div>
            <div class="cake__stripe cake__stripe--3"></div>
          </div>
        </div>

        <!-- Đĩa đặt bánh -->
        <div class="cake__stand"></div>

      </div><!-- /cake -->

    </div><!-- /scene -->

</body>
</html>
